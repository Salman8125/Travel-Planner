version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations/000001_init.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
