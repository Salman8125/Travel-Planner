# Polyglot Travel-Planner — 10 services (5 backends + 5 frontends).
# One command brings up the whole system:  docker compose up --build
#
# Five standalone products:
#   SkyScout (flights) · Roost (hotels) · PennyPilot (budget) · Weathervane (weather) · TripWeaver (itinerary)
#
# Networking note: the browser runs OUTSIDE this docker network, so each frontend is built
# with its backend URL pointing at the published HOST port (http://localhost:<port>), NOT the
# compose service name. That URL is baked at image-BUILD time via build.args (Vite/Angular
# inline env vars at build time), which is why it lives under build.args, not environment.

services:
  # ---------------- SkyScout — flights (Node+TS+Postgres / React) ----------------
  skyscout-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyscout
      POSTGRES_USER: skyscout
      POSTGRES_PASSWORD: skyscout
    volumes:
      - skyscout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyscout -d skyscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  skyscout-backend:
    build: ./SkyScout/backend
    ports: ["4001:4001"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://skyscout:skyscout@skyscout-db:5432/skyscout
      PGHOST: skyscout-db
      PGPORT: "5432"
      PGUSER: skyscout
      JWT_SECRET: dev-insecure-skyscout-jwt-secret-change-me
      SEED_ON_START: "true"
    depends_on:
      skyscout-db:
        condition: service_healthy

  skyscout-frontend:
    build:
      context: ./SkyScout/frontend
      args:
        VITE_API_URL: http://localhost:4001
    ports: ["3001:80"]
    depends_on: [skyscout-backend]

  # ---------------- Roost — hotels (Spring Boot + Postgres / Angular) ----------------
  roost-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roost
      POSTGRES_USER: roost
      POSTGRES_PASSWORD: roost
    volumes:
      - roost-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roost -d roost"]
      interval: 5s
      timeout: 3s
      retries: 10

  roost-backend:
    build: ./Roost/backend
    # Host 4002 (the Angular frontend's target) -> container 8080 (Spring Boot).
    ports: ["4002:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://roost-db:5432/roost
      SPRING_DATASOURCE_USERNAME: roost
      SPRING_DATASOURCE_PASSWORD: roost
      ROOST_JWT_SECRET: dev-insecure-roost-jwt-secret-change-me-please
      ROOST_SEED_ENABLED: "true"
    depends_on:
      roost-db:
        condition: service_healthy

  roost-frontend:
    build:
      context: ./Roost/frontend
      args:
        API_URL: http://localhost:4002
    ports: ["3002:80"]
    depends_on: [roost-backend]

  # ---------------- PennyPilot — budget (Django + Postgres / Svelte) ----------------
  pennypilot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pennypilot
      POSTGRES_USER: pennypilot
      POSTGRES_PASSWORD: pennypilot
    volumes:
      - pennypilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypilot -d pennypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  pennypilot-backend:
    build: ./PennyPilot/backend
    ports: ["4003:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: dev-insecure-pennypilot-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://pennypilot:pennypilot@pennypilot-db:5432/pennypilot
      SEED_ON_START: "true"
    depends_on:
      pennypilot-db:
        condition: service_healthy

  pennypilot-frontend:
    build:
      context: ./PennyPilot/frontend
      args:
        PUBLIC_API_URL: http://localhost:4003
    ports: ["3003:80"]
    depends_on: [pennypilot-backend]

  # ---------------- Weathervane — weather (Go + Postgres / Vue) ----------------
  weather-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    volumes:
      - weathervane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 3s
      retries: 10

  weathervane-backend:
    build: ./Weathervane/backend
    ports: ["4004:8080"]
    environment:
      DATABASE_URL: postgresql://weather:weather@weather-db:5432/weather
      JWT_SECRET: dev-insecure-weathervane-jwt-secret-change-me
      SEED_ON_START: "true"
    depends_on:
      weather-db:
        condition: service_healthy

  weathervane-frontend:
    build:
      context: ./Weathervane/frontend
      args:
        VITE_API_URL: http://localhost:4004
    ports: ["3004:80"]
    depends_on: [weathervane-backend]

  # ---------------- TripWeaver — itinerary (.NET 10 + Postgres / SolidJS) ----------------
  tripweaver-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripweaver
      POSTGRES_USER: tripweaver
      POSTGRES_PASSWORD: tripweaver
    volumes:
      - tripweaver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripweaver -d tripweaver"]
      interval: 5s
      timeout: 3s
      retries: 10

  tripweaver-backend:
    build: ./TripWeaver/backend
    # Host 4005 (the SolidJS frontend's target) -> container 8080 (.NET).
    ports: ["4005:8080"]
    environment:
      ConnectionStrings__Default: "Host=tripweaver-db;Port=5432;Database=tripweaver;Username=tripweaver;Password=tripweaver"
      Jwt__Secret: dev-insecure-tripweaver-jwt-secret-change-me-please
      Seed__Enabled: "true"
      RateLimit__Enabled: "true"
    depends_on:
      tripweaver-db:
        condition: service_healthy

  tripweaver-frontend:
    build:
      context: ./TripWeaver/frontend
      args:
        VITE_API_URL: http://localhost:4005
    ports: ["3005:80"]
    depends_on: [tripweaver-backend]

volumes:
  pennypilot-db-data:
  skyscout-db-data:
  weathervane-db-data:
  roost-db-data:
  tripweaver-db-data:
