spring:
  application:
    name: roost-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roost}
    username: ${SPRING_DATASOURCE_USERNAME:roost}
    password: ${SPRING_DATASOURCE_PASSWORD:roost}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 25s
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

roost:
  jwt:
    secret: ${ROOST_JWT_SECRET:}
    ttl: ${ROOST_JWT_TTL:24h}
  booking:
    max-stay-nights: 30
    max-rooms: 10
    cancellation-cutoff-days: 2
  rate-limit:
    enabled: ${ROOST_RATE_LIMIT_ENABLED:true}
    global-per-minute: 120
    auth-per-minute: 20
    booking-per-minute: 30
  cors:
    origins: ${ROOST_CORS_ORIGINS:}
  seed:
    enabled: ${ROOST_SEED_ENABLED:false}

logging:
  level:
    root: INFO
    com.travelplanner.roost: INFO
